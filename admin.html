<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kulzzy Radio - Birthday Wishes Admin</title>

<style>

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    min-height:100%;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    min-height:100vh;

    background:
        radial-gradient(
            circle at 50% 0%,
            rgba(30,55,100,.30),
            transparent 45%
        ),
        linear-gradient(
            135deg,
            #07152f,
            #020b1c 70%,
            #06132b
        );

    color:#fff;

    padding:28px 14px 50px;
}

.page{
    width:100%;
    max-width:1100px;
    margin:auto;
}

.header{
    text-align:center;
    margin-bottom:28px;
}

.title{
    margin:0;

    font-size:
        clamp(
            28px,
            5vw,
            54px
        );

    line-height:1.05;

    font-weight:950;

    text-transform:uppercase;
}

.title span{
    color:#ffbf16;
}


/* =========================================
   MAIN PANEL
========================================= */

.panel{
    width:100%;
    max-width:900px;

    margin:0 auto;

    background:
        rgba(7,21,47,.96);

    border:
        2px solid #ffbf16;

    border-radius:18px;

    box-shadow:
        0 12px 30px rgba(0,0,0,.35);

    overflow:hidden;
}


/* =========================================
   TOP BAR
========================================= */

.topbar{
    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:12px;

    padding:18px 20px;

    border-bottom:
        1px solid
        rgba(255,191,22,.45);
}

.topbar h2{
    margin:0;

    color:#ffbf16;

    font-size:24px;
}

.count{
    color:#dfe5ef;

    font-size:14px;

    margin-top:4px;
}


/* =========================================
   MESSAGES
========================================= */

.messages{
    padding:18px;
}

.message{
    background:
        linear-gradient(
            135deg,
            #ffb913,
            #ffca31
        );

    color:#111;

    border-radius:14px;

    padding:18px;

    margin-bottom:14px;

    box-shadow:
        0 5px 15px
        rgba(0,0,0,.18);
}

.message:last-child{
    margin-bottom:0;
}

.message-top{
    display:flex;

    justify-content:space-between;

    gap:15px;

    margin-bottom:10px;

    font-size:13px;

    color:#4d461d;
}

.message-text{
    font-size:18px;

    font-weight:500;

    line-height:1.5;

    white-space:pre-wrap;

    overflow-wrap:anywhere;
}


/* =========================================
   EMPTY
========================================= */

.empty{
    text-align:center;

    padding:40px 15px;

    color:#dfe5ef;

    font-size:16px;

    line-height:1.5;
}


/* =========================================
   STATUS
========================================= */

.status{
    margin:18px;

    padding:13px 15px;

    border-radius:10px;

    text-align:center;

    font-weight:800;

    display:none;

    line-height:1.45;
}

.status.show{
    display:block;

    background:#153f28;

    color:#b9ffd0;

    border:
        1px solid #42cf75;
}

.status.error{
    background:#4a1e25;

    color:#ffd1d7;

    border-color:#ff6575;
}


/* =========================================
   MOBILE
========================================= */

@media(max-width:650px){

    body{
        padding:
            20px
            9px
            35px;
    }

    .topbar{
        align-items:flex-start;

        flex-direction:column;
    }

    .topbar h2{
        font-size:21px;
    }

    .message-top{
        flex-direction:column;

        gap:5px;
    }

    .message-text{
        font-size:17px;
    }

}

</style>
</head>


<body>

<div class="page">


    <!-- =====================================
         HEADER
    ====================================== -->

    <div class="header">

        <h1 class="title">

            BIRTHDAY
            <span>WISHES</span>

        </h1>

    </div>



    <!-- =====================================
         ADMIN PANEL
    ====================================== -->

    <div
        id="panel"
        class="panel"
    >


        <!-- TOP BAR -->

        <div class="topbar">

            <div>

                <h2>
                    Birthday Wishes
                </h2>

                <div
                    id="count"
                    class="count"
                >
                    Connecting to Firebase...
                </div>

            </div>

        </div>



        <!-- MESSAGES -->

        <div
            id="messages"
            class="messages"
        >

            <div class="empty">

                Connecting to Birthday Wishes database...

            </div>

        </div>



        <!-- STATUS -->

        <div
            id="status"
            class="status"
        ></div>


    </div>

</div>



<script type="module">


/* =========================================================
   FIREBASE IMPORTS
========================================================= */

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
    getDatabase,
    ref,
    onValue
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";



/* =========================================================
   YOUR REAL FIREBASE CONFIGURATION
========================================================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyDcdd3ZSae1Ddxmpw7pFVNwPNql0cF6C0E",

    authDomain:
        "birthday-wishes-960bd.firebaseapp.com",

    databaseURL:
        "https://birthday-wishes-960bd-default-rtdb.europe-west1.firebasedatabase.app",

    projectId:
        "birthday-wishes-960bd",

    storageBucket:
        "birthday-wishes-960bd.firebasestorage.app",

    messagingSenderId:
        "61276094940",

    appId:
        "1:61276094940:web:5863a7d82caf1628170f19",

    measurementId:
        "G-F9HZHJPXRL"

};



/* =========================================================
   ELEMENTS
========================================================= */

const messages =
    document.getElementById(
        "messages"
    );


const count =
    document.getElementById(
        "count"
    );


const status =
    document.getElementById(
        "status"
    );



/* =========================================================
   STATUS FUNCTION
========================================================= */

function showStatus(
    text,
    error = false
){

    status.textContent =
        text;

    status.className =
        "status show" +
        (
            error
            ? " error"
            : ""
        );

}



/* =========================================================
   DATE FORMATTER
========================================================= */

function formatDate(
    timestamp
){

    if(
        timestamp === null ||
        timestamp === undefined ||
        timestamp === ""
    ){

        return "Date unavailable";

    }


    const numericTimestamp =
        Number(timestamp);


    if(
        !Number.isFinite(
            numericTimestamp
        )
    ){

        return "Date unavailable";

    }


    const date =
        new Date(
            numericTimestamp
        );


    if(
        Number.isNaN(
            date.getTime()
        )
    ){

        return "Date unavailable";

    }


    return date.toLocaleString();

}



/* =========================================================
   DISPLAY WISHES
========================================================= */

function displayWishes(
    data
){

    console.log(
        "Firebase birthdayWishes data:",
        data
    );


    /* -----------------------------------------
       NO DATA
    ----------------------------------------- */

    if(
        data === null ||
        data === undefined
    ){

        messages.innerHTML =

            '<div class="empty">' +

            'No birthday wishes have been received yet.' +

            '</div>';


        count.textContent =
            "0 wishes";


        status.className =
            "status";


        return;

    }



    /* -----------------------------------------
       CONVERT OBJECT TO ARRAY
    ----------------------------------------- */

    const wishes =

        Object.entries(
            data
        )

        .map(
            ([id, wish]) => ({

                id,

                ...wish

            })
        )

        .sort(
            (a,b) =>

                (
                    Number(
                        b.createdAt
                    )
                    || 0
                )

                -

                (
                    Number(
                        a.createdAt
                    )
                    || 0
                )
        );



    /* -----------------------------------------
       COUNT
    ----------------------------------------- */

    count.textContent =

        `${wishes.length} ${
            wishes.length === 1
            ? "wish"
            : "wishes"
        }`;



    /* -----------------------------------------
       CLEAR OLD CONTENT
    ----------------------------------------- */

    messages.innerHTML =
        "";



    /* -----------------------------------------
       DISPLAY EACH WISH
    ----------------------------------------- */

    wishes.forEach(
        (wish) => {


            const item =
                document.createElement(
                    "div"
                );

            item.className =
                "message";



            /* TOP */

            const top =
                document.createElement(
                    "div"
                );

            top.className =
                "message-top";



            /* SENDER */

            const sender =
                document.createElement(
                    "strong"
                );

            sender.textContent =
                "ANONYMOUS";



            /* DATE */

            const date =
                document.createElement(
                    "span"
                );

            date.textContent =
                formatDate(
                    wish.createdAt
                );



            top.appendChild(
                sender
            );

            top.appendChild(
                date
            );



            /* MESSAGE */

            const text =
                document.createElement(
                    "div"
                );

            text.className =
                "message-text";

            text.textContent =
                wish.message
                || "";



            /* ADD TO PAGE */

            item.appendChild(
                top
            );

            item.appendChild(
                text
            );

            messages.appendChild(
                item
            );

        }
    );



    status.className =
        "status";

}



/* =========================================================
   FIREBASE DATABASE LISTENER
========================================================= */

function listenForWishes(){

    console.log(
        "Starting Firebase database listener..."
    );


    try{


        const wishesRef =
            ref(
                db,
                "birthdayWishes"
            );


        onValue(

            wishesRef,


            /* ---------------------------------
               SUCCESS
            --------------------------------- */

            (snapshot) => {

                console.log(
                    "Firebase snapshot received."
                );


                displayWishes(
                    snapshot.val()
                );

            },


            /* ---------------------------------
               ERROR
            --------------------------------- */

            (error) => {

                console.error(
                    "Firebase Database Error:",
                    error
                );


                messages.innerHTML =

                    '<div class="empty">' +

                    'Unable to read birthday wishes.' +

                    '</div>';


                count.textContent =
                    "Database error";


                showStatus(

                    "Firebase Database Error: " +

                    (
                        error.message
                        ||
                        "Access denied or database unavailable."
                    ),

                    true

                );

            }

        );


    }catch(error){

        console.error(
            "Listener Error:",
            error
        );


        count.textContent =
            "Connection error";


        messages.innerHTML =

            '<div class="empty">' +

            'Could not connect to Firebase.' +

            '</div>';


        showStatus(

            "Could not connect to Firebase: " +

            (
                error.message
                ||
                error
            ),

            true

        );

    }

}



/* =========================================================
   INITIALIZE FIREBASE
========================================================= */

let app;

let db;


try{


    console.log(
        "Initializing Firebase..."
    );


    app =
        initializeApp(
            firebaseConfig
        );


    db =
        getDatabase(
            app
        );


    console.log(
        "Firebase initialized successfully."
    );


    count.textContent =
        "Connected — loading wishes...";


    listenForWishes();


}catch(error){


    console.error(
        "Firebase Initialization Error:",
        error
    );


    count.textContent =
        "Firebase connection failed";


    messages.innerHTML =

        '<div class="empty">' +

        'Firebase could not be initialized.' +

        '</div>';


    showStatus(

        "Firebase initialization error: " +

        (
            error.message
            ||
            error
        ),

        true

    );

}


</script>

</body>
</html>
